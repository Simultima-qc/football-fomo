[build]
  command = "npm ci && npm run build:ci"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_VERSION = "11.12.1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    X-Robots-Tag = "noindex"
